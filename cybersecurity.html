<body>
<main class="project-page">

<section class="project-info">
<div class="project-tags"><span>Cybersecurity</span><span>Risk Assessment</span><span>Security</span></div>
</section>
</div>
</main>
<script>
const images = [];
let index = 0;
const img = document.getElementById("galleryImage");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const counter = document.getElementById("counter");
const empty = document.getElementById("galleryEmpty");

function update(){
    if(!images.length){
        img.style.display="none";
        prev.style.display="none";
        next.style.display="none";
        counter.style.display="none";
        empty.style.display="flex";
        return;
    }
    img.src=images[index];
    counter.textContent=(index+1)+" / "+images.length;
    const arrows=images.length>1;
    prev.style.display=arrows?"block":"none";
    next.style.display=arrows?"block":"none";
}
prev.addEventListener("click",()=>{ index=(index-1+images.length)%images.length; update(); });
next.addEventListener("click",()=>{ index=(index+1)%images.length; update(); });
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft" && images.length>1) prev.click();
    if(e.key==="ArrowRight" && images.length>1) next.click();
});
update();
</script>
</body>
</html>
